name: 작업 계획
description: 기능 하나의 목표와 완료 기준을 정리합니다.
title: "[작업] "
body:
  - type: textarea
    id: goal
    attributes:
      label: 만들 기능
      description: 누가 어떤 일을 할 수 있게 되는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      placeholder: "- [ ] 사용자가 결과를 확인할 수 있다."
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 관련 화면과 결정할 사항
